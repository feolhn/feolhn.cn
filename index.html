<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>feolhn.cn · 180k 实验室</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=20260815-2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Lab navigation">
        <header class="brand">
          <button class="brand-mark" id="sidebarToggle" type="button" aria-label="收起侧边栏" aria-expanded="true">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <strong>feolhn.cn</strong>
            <small>个人实验室</small>
          </div>
        </header>

        <div class="nav-heading">
          <span>实验室系统</span>
        </div>

        <div class="sidebar-scroll">
          <nav id="projectNav" class="project-nav"></nav>
        </div>

        <footer class="sidebar-footer">
          <button type="button" aria-label="设置">⚙</button>
          <button type="button" aria-label="帮助">?</button>
          <button id="themeToggle" type="button" aria-label="主题：跟随系统" title="主题：跟随系统">◐</button>
        </footer>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="search">
            <kbd>⌘</kbd><kbd>K</kbd>
            <input id="searchInput" type="search" placeholder="搜索项目，或运行命令..." />
          </div>
          <div class="status-pill">
            <span></span>
            <div>
              <strong>实验室状态</strong>
              <small>所有系统正常</small>
            </div>
          </div>
        </header>

        <section class="mobile-project-list" aria-labelledby="mobileListTitle">
          <div class="mobile-list-heading"><h1 id="mobileListTitle">所有项目</h1></div>
          <div id="mobileProjectList"></div>
        </section>
      </main>

      <aside class="inspector" aria-label="Project detail">
        <div class="inspector-card" id="detailView">
          <button class="mobile-back" id="mobileBack" type="button">‹ 所有项目</button>
          <div class="detail-heading">
            <div class="project-kicker">
              <span id="detailStatusDot"></span>
              <span id="detailStatus"></span>
              <span id="detailCategory"></span>
            </div>
            <h2 id="detailTitle"></h2>
            <div id="detailStack" class="detail-meta"></div>
          </div>

          <section class="entry-section" id="entrySection">
            <div class="entry-links">
              <a id="openLink" href="#" target="_blank" rel="noreferrer">打开项目</a>
            </div>
          </section>

          <section>
            <h3>用途</h3>
            <p id="detailPurpose"></p>
          </section>

          <section>
            <h3>最近更新</h3>
            <p id="detailUpdate" class="muted"></p>
          </section>

          <section>
            <h3>下一步</h3>
            <p id="detailNext"></p>
          </section>

        </div>
      </aside>
    </div>

    <script src="./script.js?v=20260815-2"></script>
  </body>
</html>
